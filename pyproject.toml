[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-eval-harness"
version = "0.1.0"
description = "Three-layer document-eval harness: schema-level + instruction-level + render-level checks for generated form outputs (seeded from the US tax-form domain)"
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "pypdf>=4.0"]

[project.optional-dependencies]
pdfgen = ["reportlab>=4.0"]
# Capped below 2.0 deliberately: mcp_server/server.py uses the v1 API
# (mcp.server.fastmcp.FastMCP), which mcp 2.x renamed to MCPServer. An unbounded
# lower bound let 2.x resolve in CI and only worked locally because this machine
# already had 1.30.0 installed. Migrating to the 2.x API is a tracked follow-up.
mcp = ["mcp>=1.0,<2"]

[project.scripts]
doc-eval = "harness.__main__:main"

[tool.setuptools]
packages = ["harness", "mcp_server"]
